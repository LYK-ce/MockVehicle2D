[package]
name = "map-sync-node"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "map-sync-node"
path = "rust/map_sync_node.rs"

[[test]]
name = "sidecar_binary"
path = "rust/sidecar_binary_test.rs"

[dependencies]
futures = "0.3"
libp2p = { version = "0.56", default-features = false, features = ["gossipsub", "macros", "noise", "tcp", "tokio", "yamux"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
